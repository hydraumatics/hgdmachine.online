# Cloudflare Pages project configuration. Read by Cloudflare Git builds and by `wrangler pages ...`.
# NEVER put secrets in this file: it is committed to Git.
name = "hydraumatics-store"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# ---- Runtime variables for the Functions (not secret, safe to commit) ----
[vars]
STAFF_EMAIL = "procurement@hgdmachines.online"                          # who gets quote notifications
MAIL_FROM = "Hydraumatics General Dealers <noreply@hgdmachines.online>" # only used when RESEND_API_KEY is set

# ---- D1 database for customers, quote requests and newsletter subscribers ----
# 1) npx wrangler d1 create hydraumatics-db      2) paste the printed id below and remove the leading #
# 3) npx wrangler d1 migrations apply hydraumatics-db --remote
# [[d1_databases]]
# binding = "DB"
# database_name = "hydraumatics-db"
# database_id = "PASTE-THE-ID-HERE"
# migrations_dir = "migrations"

# ---- SECRETS (set once, never committed) ----
#   npx wrangler pages secret put WEB3FORMS_KEY            --project-name hydraumatics-store   # quote emails (Option B)
#   npx wrangler pages secret put NEWSLETTER_WEB3FORMS_KEY --project-name hydraumatics-store   # optional, signups to news@
#   npx wrangler pages secret put RESEND_API_KEY           --project-name hydraumatics-store   # better email (Option A)
#   npx wrangler pages secret put ADMIN_TOKEN              --project-name hydraumatics-store   # enables /api/admin/export
#   npx wrangler pages secret put IP_SALT                  --project-name hydraumatics-store   # any long random string
# (or: Cloudflare dashboard > Workers & Pages > your project > Settings > Variables and Secrets)
#
# ---- BUILD-TIME settings for Astro (public by design) go in `.env.production`, see `.env.production.example` ----
